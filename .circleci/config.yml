# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1
jobs:
  build_and_test:
    docker:
        # Specify service dependencies here if necessary
        # CircleCI maintains a library of pre-built images
        # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: cimg/node:22.23.2
      - image: circleci/mongo:5.0

    working_directory: ~/project

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run:
          name: "Setup encrypted .env variable per Classy fork (chooses default env.enc when not set)"
          command: |
            echo 'export ENV_ENC_FILE="${ENCRYPT_ENV:-env}"' >> $BASH_ENV # Redirect ENCRYPT_ENV into $BASH_ENV

     # openssl aes-256-cbc -e -iter 100000 -md sha512 -in ../.env -out env.enc -k $ENVKEY
      - run:
            command: cd .circleci && openssl aes-256-cbc -d -iter 100000 -md sha512 -in "$ENV_ENC_FILE.enc" -out ../.env -k $ENVKEY
            name: Configuring .env
            when: always

      - run:
            command: ./helper-scripts/bootstrap-plugin.sh
            name: Bootstraps default plugin for tests

      - run: yarn install --ignore-engines

      - run:
            command: cd packages/common && yarn install --ignore-engines
            name: Preparing common

      - run:
            command: cd packages/autotest && yarn install --ignore-engines
            name: Preparing autotest

      - run:
            command: cd packages/portal/backend && mkdir -p ssl/ && yarn install --ignore-engines
            name: Preparing backend

      - save_cache:
          paths:
            - node_modules
#            - packages/common/node_modules
#            - packages/portal-backend/node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      - run:
          name: Generate self-signed certs
          command: |
            set -x
            SSL_PATH=~/project/packages/portal/backend/ssl
            mkdir -p $SSL_PATH && openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 -keyout $SSL_PATH/privkey.pem -out $SSL_PATH/fullchain.pem -subj "/C=GB/ST=Vancouver/L=Vancouver/O=Global Security/OU=IT Department/CN=test.com"
          when: always

      - run:
            command: cd plugins/default && yarn run build
            name: Building plugin
            when: always

      - run:
            command: cd packages/common && ../../node_modules/typescript/bin/tsc
            name: Building common
            when: always

      - run:
            command: cd packages/portal/backend && ../../../node_modules/typescript/bin/tsc
            name: Building backend
            when: always

      - run:
            command: cd packages/portal/frontend && ../../../node_modules/typescript/bin/tsc && yarn webpack
            name: Building frontend and bundle with Webpack
            when: always

      # statically validate the frontend (this is the best we can do as there are no automated UI tests yet)
#      - run:
#            command: cd packages/portal/frontend && ../../../node_modules/typescript/bin/tsc && ../../../node_modules/webpack/bin/webpack.js
#            name: Building frontend
#            when: always

      - run:
            command: cd packages/autotest && ../../node_modules/typescript/bin/tsc
            name: Building autotest
            when: always

      - run:
          command: yarn run lint
          name: Checking project formatting and lint rules (biome)
          when: always

      - run:
            command: git config --global user.email "CI@test.com" && git config --global user.name "CI Test Name"
            name: Configure local git
            when: on_success

     ## WORKS
      - run:
            command: |
                      set -e
                      cd packages/portal/backend
                      ./node_modules/.bin/nyc --reporter html --report-dir ../../../testOutput/backend/coverage yarn run testCI
            name: Running backend tests
            environment:
              MOCHA_FILE: ../../../testOutput/backend/test/test-results.xml
              # CircleCI truncates step output at 400KB and this suite blows past that, which
              # hides the early specs (GitHubActionSpec) entirely. WARN keeps warn/error/test
              # (including the Log.test branch dumps) and drops the info/trace chatter.
              #
              # NOTE: the "text-lcov" reporter used to be here as well. It writes the whole lcov
              # report to stdout -- 105KB, a quarter of the truncation budget -- and nothing reads
              # it: the HTML report is written to testOutput as an artifact, and the coveralls and
              # codecov steps below regenerate lcov themselves from .nyc_output. It was pure noise,
              # and it is what pushed the real failure (build 4281) past the cap.
              LOG_LEVEL: WARN
            when: on_success

      - run:
            command: |
                      mkdir -p testOutput/backend/test/
                      # tests may have failed (or not run at all); only convert what exists
                      if [ -f testOutput/backend/test/test-results.xml ]; then
                        ./node_modules/xunit-viewer/bin/xunit-viewer --results=testOutput/backend/test/test-results.xml --output=testOutput/backend/test/index.html
                      fi
            name: Converting backend test results to HTML
            when: always

      # Makes docker.sock available to AutoTest docker endpoint tests
      - setup_remote_docker:
            version: default

      - run:
            command: |
                      set -e
                      cd packages/autotest
                      yarn coverCI
            name: Running autotest tests
            environment:
              MOCHA_FILE: ../../testOutput/autotest/test/test-results.xml
            when: on_success

      - run:
            command: |
                      mkdir -p testOutput/autotest/test/
                      # tests may have failed (or not run at all); only convert what exists
                      if [ -f testOutput/autotest/test/test-results.xml ]; then
                        ./node_modules/xunit-viewer/bin/xunit-viewer --results=testOutput/autotest/test/test-results.xml --output=testOutput/autotest/test/index.html
                      fi
            name: Converting autotest test results to HTML
            when: always

      - run:
            command: cd packages/portal/backend && yarn coveralls
            name: Running backend coveralls
            when: on_success

# coveralls doesn't integrate coverage
# so this overwrites the backend coverage (which we care about more)
# this is disabled and shouldn't be enabled until this is fixed
#      - run:
#            command: cd packages/autotest && yarn coveralls
#            name: Running autotest coveralls
#            when: always

      - run:
            command: cd packages/portal/backend && yarn codecov
            name: Running backend codecov
            when: on_success

      # NOTE: store_artifacts runs even when an earlier step failed, so the JUnit XML
      # written under testOutput/ is uploaded on red builds too -- that is how you find
      # out which tests failed (the step log is truncated by CircleCI at 400KB).
      - store_test_results:
          path: testOutput

      - store_artifacts:
          path: testOutput

      - run:
            command: rm .env && rm packages/portal/backend/ssl/fullchain.pem && rm packages/portal/backend/ssl/privkey.pem
            name: Cleaning up
            when: always

  build_only:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project

    environment:
      TEST_LOGS: /home/circleci/project/test-logs

    steps:
      - checkout

      - run:
          name: "Setup encrypted .env variable per Classy fork (chooses default env.enc when not set)"
          command: |
            set -x
            echo 'export ENV_ENC_FILE="${ENCRYPT_ENV:-env}"' >> $BASH_ENV # Redirect ENCRYPT_ENV into $BASH_ENV

     # openssl aes-256-cbc -e -iter 100000 -md sha512 -in ../.env -out env.enc -k $ENVKEY
      - run:
          name: Configuring .env
          command: cd .circleci && openssl aes-256-cbc -d -iter 100000 -md sha512 -in "$ENV_ENC_FILE.enc" -out ../.env -k $ENVKEY
          when: always

     # CircleCI runs in root, which is 0 for UID & GID. Must do after file unencrypted.
      - run:
          name: "Export UID and GID to configuration file"
          command: |
            set -x
            echo -e "GID=0\nUID=0\n" >> .env

     # SSLs need to be set for Portal container or else "volume name is too short" Docker Portal create error
      - run:
          name: "Export SSL CERT and SSL KEY paths"
          command: |
            set -x
            SSL_PATH=~/project/packages/portal/backend/ssl
            echo -e "HOST_SSL_CERT_PATH=$SSL_PATH/fullchain.pem\nHOST_SSL_KEY_PATH=$SSL_PATH/privkey.pem\n" >> .env

      - run:
          name: Generate self-signed certs
          command: |
            set -x
            SSL_PATH=~/project/packages/portal/backend/ssl
            mkdir -p $SSL_PATH && openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 -keyout $SSL_PATH/privkey.pem -out $SSL_PATH/fullchain.pem -subj "/C=GB/ST=Vancouver/L=Vancouver/O=Global Security/OU=IT Department/CN=test.com"
          when: always

      - run:
          name: Create mount path for MongoDB
          command: sudo mkdir -p /var/opt/classy/db

      - run:
          name: Create paths for artifact collections
          command: |
            set -x
            sudo mkdir -p ${TEST_LOGS}
            cd ${TEST_LOGS} && sudo touch portal-front-end-test.log portal-back-end-test.log autotest-test.log docker-stdout.log
            sudo chmod 777 -R ${TEST_LOGS}

     # The .env in env.enc is written for host-local development, where every service is
     # reachable on localhost. Inside the compose network, localhost is the container itself,
     # so the service URLs have to name the services instead. PERSIST_DIR must also be
     # absolute: compose uses it as a mount target and rejects a relative path.
      - run:
          name: "Export container-specific service URLs to configuration file"
          command: |
            set -x
            MONGO_USER=$(grep -m 1 "^MONGO_INITDB_ROOT_USERNAME=" .env | cut -d= -f2-)
            MONGO_PASS=$(grep -m 1 "^MONGO_INITDB_ROOT_PASSWORD=" .env | cut -d= -f2-)
            {
              echo "DB_URL=mongodb://${MONGO_USER}:${MONGO_PASS}@db:27017/?authMechanism=DEFAULT"
              echo "AUTOTEST_URL=http://autotest"
              echo "BACKEND_URL=https://portal"
              echo "PERSIST_DIR=/output"
            } >> .env

      - run:
          name: Bootstraps default plugin for containers
          command: ./helper-scripts/bootstrap-plugin.sh

      - run:
          name: Build and start containers
          command: |
            set -x
            docker compose up -d --build 2>&1 | tee -a ${TEST_LOGS}/docker-stdout.log

     # `up -d` only reports that the containers were started, so it passes even when a service
     # crashes on its first request (restart: always then hides it). Polling an endpoint that
     # goes proxy -> portal -> mongo is what actually proves the stack is wired together.
      - run:
          name: Verify the stack is serving
          command: |
            set -x
            for i in $(seq 1 30); do
              code=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/portal/config || true)
              if [ "$code" = "200" ]; then
                echo "stack responded 200 after ${i} attempt(s)"
                exit 0
              fi
              sleep 5
            done
            echo "stack did not serve /portal/config within 150s (last status: ${code})"
            exit 1

      - run:
          name: Collect container logs
          command: docker compose logs --no-color >> ${TEST_LOGS}/docker-stdout.log 2>&1
          when: always

      - run:
          name: Shut down containers
          command: docker compose down 2>&1 | tee -a ${TEST_LOGS}/docker-stdout.log
          when: always

      - run:
          name: Cleaning up Docker containers and images
          command: docker system prune -af 2>&1 | tee -a ${TEST_LOGS}/docker-stdout.log
          when: always

      - store_artifacts:
          path: /home/circleci/project/test-logs
          destination: raw-test-output

      - run:
          name: Cleaning up SSLs and Environment
          command: rm .env && rm ~/project/packages/portal/backend/ssl/fullchain.pem && rm ~/project/packages/portal/backend/ssl/privkey.pem
          when: always

      - run:
          name: Cleaning up artifacts
          command: |
            set -x
            sudo rm -rf ${TEST_LOGS}
          when: always
workflows:
  ci_tests:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      - build_and_test
      - build_only
  nightly:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ nightly_build, << pipeline.schedule.name >> ]
    jobs:
      - build_and_test
      - build_only
